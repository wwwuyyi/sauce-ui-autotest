[pytest]
; ---------------- 用例收集规则 ----------------
testpaths = test_cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; 项目根目录加入 sys.path，保证 pages / base / utils 包可直接 import
pythonpath = .

; ---------------- 默认执行参数 ----------------
; -s: 打印日志输出  -v: 详细报告  输出 Allure 原始数据，每次执行前清理旧数据
addopts = -vs --alluredir=reports/allure_results --clean-alluredir

; ---------------- 自定义标记注册（未注册的 marker 会产生警告） ----------------
markers =
    smoke: 冒烟测试用例（核心主链路，快速验证版本可测性）