[pytest]
; ---------------- 用例收集规则 ----------------
testpaths = test_cases unit_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; 项目根目录加入 sys.path，保证 pages / base / utils 包可直接 import
pythonpath = .

; ---------------- 默认执行参数 ----------------
; 默认只输出 Allure 原始数据，并在每次执行前清理旧数据；
; -v / -s 等详细输出由手动命令按需追加，CI 与默认本地运行保持精简
addopts = --alluredir=reports/allure_results --clean-alluredir

; ---------------- 自定义标记注册（未注册的 marker 会产生警告） ----------------
markers =
    smoke: 冒烟测试用例（核心主链路，快速验证版本可测性）