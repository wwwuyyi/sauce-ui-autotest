# CI 工作流（两个 job 按触发源分工）：
#   smoke job —— push / PR 触发：本地托管站点上跑冒烟 6 条核心主链路（确定性门禁）；
#   pages job —— 定时 / 手动触发：本地托管站点上跑全量 56 条，内置生成器渲染
#                单文件 HTML 报告并发布到 GitHub Pages
#                （报告地址 https://<用户名>.github.io/sauce-ui-autotest/，
#                需一次性在仓库 Settings → Pages → Source 选择 "GitHub Actions"）。
#                手动触发可选 target=live 改为对线上 saucedemo 做监控（允许失败、不阻断）。
#
# 为什么统一改用本地站点：
#   线上 saucedemo 偶发前端卡死（加购按钮状态不刷新 / SPA 路由点击不跳转 /
#   Chrome 渲染进程无响应），会让 CI 与报告因站点抖动变红或满是假失败，
#   门禁与报告都失去意义。仓库内 testsite/ 固化了该站点的静态构建产物
#   （纯前端：账号/商品/购物车全在 JS + localStorage，无后端），
#   CI 用 scripts/serve_local_site.py 本地托管，配合 BASE_URL 环境变量指向它，
#   得到 100% 确定的执行环境；线上站点监控仅保留为手动可选项。
#
# 浏览器模式：CI 使用 xvfb-run 虚拟显示 + 有头 Chrome（HEADLESS=false）。
#   CI 无头模式偶发输入事件丢失（点击/键盘命令成功返回但页面无响应、控制台无
#   JS 报错），已于 2026-11 多次复现；有头模式在虚拟显示下可规避该问题。
#
# 环境变量约定（conftest / 页面层读取）：
#   HEADLESS=false           -> Xvfb 下运行有头 Chrome
#   RECORDING=false          -> 关闭失败录屏线程（0.5s/帧截图与主线程争抢 chromedriver）
#   WAIT_TIMEOUT=30          -> 显式等待默认超时上浮（无 GPU runner 响应偏慢）
#   BASE_URL=...             -> 测试目标覆盖（同时派生 urls 中的各页面地址）
#   命令附 --reruns 1        -> 线上监控任务吸收站点偶发抖动（pytest-rerunfailures）
#   EDGE_DRIVER_PATH 未设置  -> Selenium Manager 自动下载 chromedriver
# （runner 自带 Chrome；仓库内无任何本机地址/账号/驱动路径信息）
name: UI Tests

on:
  push:
  pull_request:
  schedule:
    # 工作日 UTC 01:17（北京时间 09:17）自动运行全量并更新 Pages 报告（本地站点）
    - cron: "17 1 * * 1-5"
  workflow_dispatch:    # 手动触发：全量运行并更新 Pages 报告
    inputs:
      target:
        description: "测试目标：local=本地托管站点（确定性，推荐）；live=线上 saucedemo 监控"
        type: choice
        options: [local, live]
        default: local

# pages job 发布所需的 Pages 权限；smoke job 不受影响
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ---------- Job 1：冒烟门禁（每次 push / PR） ----------
  smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest      # 官方 runner 自带 Chrome；双平台可改 windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: 静态检查（ruff）
        run: |
          pip install ruff
          ruff check .
      # 本地站点与测试同一 step 内启动：避免 GitHub runner 在 step 结束时清理后台进程。
      # 使用 Xvfb 虚拟显示 + 有头 Chrome：CI 无头模式偶发输入事件丢失（点击/键盘命令
      # 成功但页面无响应、控制台无报错），有头模式可规避该问题；--reruns 1 作为兜底。
      - name: 启动本地站点并运行冒烟测试（Xvfb + 有头 Chrome）
        run: |
          python scripts/serve_local_site.py --port 8000 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -m smoke --browser=chrome --reruns 1 --reruns-delay 2
        env:
          HEADLESS: "false"
          RECORDING: "false"
          WAIT_TIMEOUT: "30"
          BASE_URL: "http://127.0.0.1:8000/"
      - name: 上传 Allure 原始结果（无论成败均可取回排障）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure_results/

  # ---------- Job 2：全量（本地站点）→ 报告发布 GitHub Pages（定时 / 手动） ----------
  pages:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      # 定时任务 / 手动 target=local：本地站点全量（确定性报告，Xvfb + 有头 Chrome）
      - name: 启动本地站点并运行全量测试（确定性报告，56 条）
        if: github.event_name == 'schedule' || inputs.target == 'local'
        run: |
          python scripts/serve_local_site.py --port 8000 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest --browser=chrome --reruns 1 --reruns-delay 2
        env:
          HEADLESS: "false"
          RECORDING: "false"
          WAIT_TIMEOUT: "30"
          BASE_URL: "http://127.0.0.1:8000/"
      # 手动 target=live：线上 saucedemo 监控，站点抖动不把工作流标红
      - name: 运行全量测试（线上 saucedemo 监控，56 条）
        if: inputs.target == 'live'
        continue-on-error: true
        run: python -m pytest --browser=chrome --reruns 1 --reruns-delay 3
        env: { HEADLESS: "true", RECORDING: "false", WAIT_TIMEOUT: "30" }
      # 测试即便有失败也照常出报告并发布——报告的价值就是呈现失败现场
      - name: 内置生成器渲染单文件 HTML 报告
        if: always()
        run: python generate_report.py
      - name: 上传 Allure 原始结果存档（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-full
          path: reports/allure_results/
      - name: 配置 Pages
        if: always()
        uses: actions/configure-pages@v4
      - name: 上传 Pages 产物（html-report 自包含目录）
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/html-report
      - name: 发布到 GitHub Pages
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4