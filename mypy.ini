# mypy config (non-strict; framework base layer + page objects only).
# NOTE: keep this file ASCII-only -- configparser reads .ini with the locale
# encoding on Windows (GBK), so UTF-8 comments would break local runs.
# Local: .venv/Scripts/python -m mypy   CI: python -m mypy
[mypy]
python_version = 3.10
files = base, pages
ignore_missing_imports = True
warn_unused_ignores = True
show_error_codes = True
