# ruff 静态检查配置（CI 与本地统一执行）
# 本地执行：.venv/Scripts/ruff check .（Windows）或 .venv/bin/ruff check .（类 Unix）
line-length = 120          # 与项目常见行宽一致（中文注释长行不硬卡，见下）
target-version = "py310"   # README 声明的最低 Python 版本

[lint]
# 只开"确定性错误"规则：
#   E4/E7/E9 - 空文件/语法错误/解析错误
#   F        - 未定义名称/未使用导入与变量等真实缺陷
#   I        - import 排序与分组
# 有意不开：UP 系列现代化规则（项目风格统一保留 # -*- coding -*- 声明与 Optional[int] 写法，
# 属风格而非缺陷）、E501 行宽（中文注释/长日志行人工把控）。
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
"generate_report.py" = ["E501"]