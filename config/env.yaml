# =====================================================================
# 环境配置文件：测试地址 / 浏览器 / 账号 / 期望数据 / 用例数据
# 原则：测试代码零硬编码，所有可变数据一律从本文件读取
# =====================================================================

env:
  name: "test"                            # 环境名称（展示于 Allure 报告 Environment 区块）

# ---------------- 测试地址 ----------------
base_url: "https://www.saucedemo.com/"    # 被测系统入口地址
urls:
  inventory: "https://www.saucedemo.com/inventory.html"              # 商品列表页
  cart: "https://www.saucedemo.com/cart.html"                        # 购物车页
  checkout_step_one: "https://www.saucedemo.com/checkout-step-one.html"  # 结算第一步
  checkout_step_two: "https://www.saucedemo.com/checkout-step-two.html"  # 结算概览页
  checkout_complete: "https://www.saucedemo.com/checkout-complete.html"  # 订单完成页
  item_detail: "https://www.saucedemo.com/inventory-item.html?id=4"  # Backpack 详情页
  saucelabs_prefix: "https://saucelabs.com"                          # About 外链域名前缀

# ---------------- 浏览器配置 ----------------
browser:
  name: "chrome"              # 默认浏览器：chrome / firefox / edge（命令行 --browser 可覆盖）
  headless: false             # 无头模式开关（CI 环境建议 true）
  window_size: "1920,1080"    # 窗口大小
  page_load_timeout: 30       # 页面加载超时（秒）
  # Edge 本地驱动路径（本机私有配置，提交版保持为空，仓库零机器信息）：
  # 网络受限且 Selenium Manager 自动下载失败时，通过用户环境变量 EDGE_DRIVER_PATH
  # 指向本地驱动（本机可用 scripts/setup_local_env.py 一键注册），留空即自动管理模式。
  edge_driver_path: ""

# ---------------- 等待策略配置（全项目只用显式等待） ----------------
timeout:
  explicit_wait: 10           # 显式等待默认超时（秒）
  poll_frequency: 0.5         # 显式等待轮询间隔（秒）
  glitch_wait: 20             # performance_glitch_user 专用超时（渲染延迟高，单独上浮）
  reset_wait: 20              # Reset App State 按钮复位等待预算（重渲染较慢，单独上浮）

# ---------------- 登录账号 ----------------
accounts:
  standard: {username: "standard_user", password: "secret_sauce"}
  locked:   {username: "locked_out_user", password: "secret_sauce"}
  wrong:    {username: "wrong_user", password: "wrong_password"}
  problem:  {username: "problem_user", password: "secret_sauce"}
  glitch:   {username: "performance_glitch_user", password: "secret_sauce"}
  error_user: {username: "error_user", password: "secret_sauce"}
  visual:   {username: "visual_user", password: "secret_sauce"}

# ---------------- 期望数据（断言基准） ----------------
expected:
  products_title: "Products"              # 商品列表页主标题
  inventory_item_count: 6                 # 商品总数
  product_names: &AZ_NAMES                # 官方商品名称列表（A→Z 顺序，锚点供 sort_expected 复用）
    - "Sauce Labs Backpack"
    - "Sauce Labs Bike Light"
    - "Sauce Labs Bolt T-Shirt"
    - "Sauce Labs Fleece Jacket"
    - "Sauce Labs Onesie"
    - "Test.allTheThings() T-Shirt (Red)"
  titles:                                 # 各页主标题文本
    cart: "Your Cart"
    checkout_step_one: "Checkout: Your Information"
    checkout_step_two: "Checkout: Overview"
  error_messages:                         # 错误提示文案（含标点全量精确匹配）
    locked: "Epic sadface: Sorry, this user has been locked out."
    mismatch: "Epic sadface: Username and password do not match any user in this service"
    username_required: "Epic sadface: Username is required"
    password_required: "Epic sadface: Password is required"
    no_first: "Error: First Name is required"
    no_last: "Error: Last Name is required"
    no_zip: "Error: Postal Code is required"
    not_login_substrings:                 # 未登录访问内页的重定向提示（contains 断言子串）
      - "You can only access"
      - "when you are logged in"
  visual_position_strict: false           # LOGIN-010 visual_user 布局探针：false=采样记录软断言，true=硬门禁
  require_image_alt_nonempty: false      # 商品图 alt 非空硬校验开关：当前站点版本部分图片 alt 渲染为空
                                         # （实测存在），false=记录型软校验，true=恢复硬门禁

# ---------------- 登录模块用例数据（数据驱动） ----------------
login_cases:
  # 必填校验用例组：字段值为空串表示"不输入"（对应 SAUCE-LOGIN-004/005/006）
  required_field_cases:
    - name: "空用户名+空密码登录"
      case_id: "SAUCE-LOGIN-004"
      username: ""
      password: ""
      expected_error: "username_required"    # 关联 expected.error_messages 的 key
      severity: "critical"
    - name: "仅用户名+密码为空登录"
      case_id: "SAUCE-LOGIN-005"
      username: "standard_user"              # 与 accounts.standard 保持一致
      password: ""
      expected_error: "password_required"
      severity: "normal"
    - name: "用户名为空+仅密码登录"
      case_id: "SAUCE-LOGIN-006"
      username: ""
      password: "secret_sauce"
      expected_error: "username_required"
      severity: "normal"

# =====================================================================
# 以下为商品首页 / 详情页 / 购物车 / 结算 / 菜单 / 通用 / 特殊账号模块数据
# =====================================================================

# ---------------- 商品数据（slug / id / 名称 / 价格 四元组） ----------------
products:
  - {slug: "sauce-labs-backpack", id: 4, name: "Sauce Labs Backpack", price: "29.99"}
  - {slug: "sauce-labs-bike-light", id: 0, name: "Sauce Labs Bike Light", price: "9.99"}
  - {slug: "sauce-labs-bolt-t-shirt", id: 1, name: "Sauce Labs Bolt T-Shirt", price: "15.99"}
  - {slug: "sauce-labs-fleece-jacket", id: 5, name: "Sauce Labs Fleece Jacket", price: "49.99"}
  - {slug: "sauce-labs-onesie", id: 2, name: "Sauce Labs Onesie", price: "7.99"}
  - {slug: "test.allthethings()-t-shirt-(red)", id: 3, name: "Test.allTheThings() T-Shirt (Red)", price: "15.99"}

# ---------------- 排序期望数据（四种排序的完整期望序列） ----------------
sort_expected:
  az_names: *AZ_NAMES                                          # A→Z 与官方默认顺序一致
  az_prices: ["$29.99", "$9.99", "$15.99", "$49.99", "$7.99", "$15.99"]
  za_names:
    - "Test.allTheThings() T-Shirt (Red)"
    - "Sauce Labs Onesie"
    - "Sauce Labs Fleece Jacket"
    - "Sauce Labs Bolt T-Shirt"
    - "Sauce Labs Bike Light"
    - "Sauce Labs Backpack"
  za_prices: ["$15.99", "$7.99", "$49.99", "$15.99", "$9.99", "$29.99"]
  lohi_names:
    - "Sauce Labs Onesie"
    - "Sauce Labs Bike Light"
    - "Sauce Labs Bolt T-Shirt"
    - "Test.allTheThings() T-Shirt (Red)"
    - "Sauce Labs Backpack"
    - "Sauce Labs Fleece Jacket"
  lohi_prices: ["$7.99", "$9.99", "$15.99", "$15.99", "$29.99", "$49.99"]
  # 注意：降序排序下同价商品（两件 $15.99）保持 DOM 原始顺序（JS 稳定排序），
  # 即 Bolt T-Shirt 在前、T-Shirt (Red) 在后；与升序列表"反转"的结果不同，勿直接 mirrored。
  hilo_names:
    - "Sauce Labs Fleece Jacket"
    - "Sauce Labs Backpack"
    - "Sauce Labs Bolt T-Shirt"
    - "Test.allTheThings() T-Shirt (Red)"
    - "Sauce Labs Bike Light"
    - "Sauce Labs Onesie"
  hilo_prices: ["$49.99", "$29.99", "$15.99", "$15.99", "$9.99", "$7.99"]

# ---------------- 排序用例数据（SAUCE-INV-003/004/005/006 参数化） ----------------
sort_cases:
  - {case_id: "SAUCE-INV-003", value: "az",   name: "名称升序(A→Z)",    names_key: "az_names",   prices_key: "az_prices"}
  - {case_id: "SAUCE-INV-004", value: "za",   name: "名称降序(Z→A)",    names_key: "za_names",   prices_key: "za_prices"}
  - {case_id: "SAUCE-INV-005", value: "lohi", name: "价格升序(low→high)", names_key: "lohi_names", prices_key: "lohi_prices"}
  - {case_id: "SAUCE-INV-006", value: "hilo", name: "价格降序(high→low)", names_key: "hilo_names", prices_key: "hilo_prices"}

# ---------------- 购物车 / 结算用例数据 ----------------
checkout:
  default_item_slugs: ["sauce-labs-backpack", "sauce-labs-bike-light"]  # 预置购物车标准两件商品
  valid_info: {first: "Zhang", last: "San", zip: "100000"}              # 正常结算信息
  invalid_field_cases:                          # SAUCE-CO-003/004/005（必填校验参数化）
    - {case_id: "SAUCE-CO-003", name: "空 FirstName 提交", first: "",     last: "San", zip: "100000", expected_error: "no_first", severity: "critical"}
    - {case_id: "SAUCE-CO-004", name: "空 LastName 提交",  first: "Zhang", last: "",  zip: "100000", expected_error: "no_last",  severity: "critical"}
    - {case_id: "SAUCE-CO-005", name: "空 ZipCode 提交",   first: "Zhang", last: "San", zip: "",      expected_error: "no_zip",   severity: "critical"}
  special_input_cases:                           # SAUCE-CO-006（非法字符/XSS 载荷参数化两组）
    - {name: "XSS载荷", first: "<script>alert('xss')</script>"}
    - {name: "特殊符号输入", first: "!@#$%^&*()_+"}
  long_input_length: 300                         # SAUCE-CO-007 超长字符串长度
  invalid_zip: "abc!@"                           # SAUCE-CO-008 非数字邮编
  summary_labels:                                # SAUCE-CO-009 金额标签（字符串精确断言基准）
    subtotal: "Item total: $39.98"
    tax: "Tax: $3.20"
    total: "Total: $43.18"
  complete_header: "Thank you for your order!"   # SAUCE-CO-010 完成页标题
  complete_text: "Your order has been dispatched, and will arrive just as fast as the pony can get there!"

# ---------------- 未登录访问内部页面（SAUCE-COM-003 参数化） ----------------
internal_pages:
  - "/inventory.html"
  - "/cart.html"
  - "/checkout-step-one.html"
  - "/inventory-item.html?id=4"

# ---------------- 特殊账号专项阈值（SAUCE-SPC 系列） ----------------
special_users:
  glitch_min_delay: 3.0           # glitch 加载耗时绝对阈值（秒）
  glitch_relative_factor: 2       # 相对基线倍数：glitch 耗时 >= N × standard 基线
  error_user_max_added: 6         # error_user 基线下 6/6 可加购，断言实际成功数 < 6
  visual_offset:                  # visual_user 布局偏移像素阈值（可配置）
    x: 50                         # 水平偏移阈值
    y: 70                         # 垂直偏移阈值
  visual_offset_strict: false     # false=采样记录软断言；true=硬门禁